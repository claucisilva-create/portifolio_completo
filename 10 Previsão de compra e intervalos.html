<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão de Demanda e Intervalo de Estoque</title>
    <style>
        /* Estética Clean Dark */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: #1E1E1E;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2C2C2C;
        }

        h1 {
            font-size: 24px;
            color: #FFFFFF;
            margin-bottom: 5px;
            text-align: center;
            font-weight: 600;
        }

        p.subtitle {
            text-align: center;
            color: #888888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #A0A0A0;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #2D2D2D;
            border: 1px solid #404040;
            border-radius: 6px;
            color: #FFFFFF;
            padding: 12px;
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #00ADB5;
        }

        button {
            width: 100%;
            background-color: #00ADB5;
            color: #FFFFFF;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #008C9E;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #252525;
            border-radius: 8px;
            border-left: 4px solid #00ADB5;
            display: none;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-card {
            background-color: #1E1E1E;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #2D2D2D;
        }

        .metric-label {
            font-size: 12px;
            color: #888888;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 20px;
            color: #FFFFFF;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Tabela de Sugestão de Pedidos */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #1E1E1E;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2D2D2D;
        }

        th {
            background-color: #2D2D2D;
            color: #00ADB5;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        .sugestao-highlight {
            font-weight: bold;
            color: #00ADB5;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Previsão de Compra e Intervalos</h1>
    <p class="subtitle">Calcula a demanda com base no intervalo real de saídas</p>
    
    <div class="form-group">
        <label for="datesInput">Cole a coluna de datas dos bipes (uma por linha):</label>
        <textarea id="datesInput" placeholder="Exemplo:&#10;01/05/2026&#10;16/05/2026&#10;31/05/2026"></textarea>
    </div>

    <button onclick="analisarEstoque()">Analisar Padrão de Consumo</button>

    <div id="resultBox" class="result-box">
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Intervalo Médio de Saída</div>
                <div id="lblIntervalo" class="metric-value">0 dias</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Consumo Diário Estimado</div>
                <div id="lblConsumoDiario" class="metric-value">0 unidades</div>
            </div>
        </div>

        <h3 style="color: #FFF; font-size: 16px; margin-bottom: 10px;">Sugestão de Pedido para Compra</h3>
        <table>
            <thead>
                <tr>
                    <th>Período Alvo</th>
                    <th>Duração (Dias)</th>
                    <th>Quantidade Mínima a Pedir</th>
                </tr>
            </thead>
            <tbody id="tabelaPrevisao">
                </tbody>
        </table>
    </div>
</div>

<script>
function converterData(stringData) {
    // Trata formatos comuns como DD/MM/AAAA ou DD/MM/AAAA HH:MM:SS
    const partes = stringData.split(' ')[0].split('/');
    if (partes.length === 3) {
        return new Date(partes[2], partes[1] - 1, partes[0]);
    }
    return null;
}

function analisarEstoque() {
    const input = document.getElementById('datesInput').value;
    const resultBox = document.getElementById('resultBox');
    const lblIntervalo = document.getElementById('lblIntervalo');
    const lblConsumoDiario = document.getElementById('lblConsumoDiario');
    const tabelaPrevisao = document.getElementById('tabelaPrevisao');

    // Processa linhas e converte para objetos Date válidos
    let datas = input.split('\n')
                     .map(linha => linha.trim())
                     .filter(linha => linha !== "")
                     .map(converterData)
                     .filter(data => data !== null);

    if (datas.length < 2) {
        alert("Por favor, insira pelo menos duas datas de saídas (bipes) para calcular o intervalo entre elas.");
        return;
    }

    // Ordena as datas da mais antiga para a mais recente
    datas.sort((a, b) => a - b);

    // Calcula os intervalos em dias entre bipes consecutivos
    let somaIntervalos = 0;
    let totalIntervalos = 0;

    for (let i = 1; i < datas.length; i++) {
        const diferencaTempo = datas[i] - datas[i - 1];
        const diferencaDias = diferencaTempo / (1000 * 60 * 60 * 24); // Converte milissegundos para dias
        
        somaIntervalos += diferencaDias;
        totalIntervalos++;
    }

    // Se houveram bipes no mesmo dia, a diferença dá 0. 
    // O intervalo médio nos diz: "A cada X dias, 1 item sai"
    let intervaloMedio = somaIntervalos / totalIntervalos;
    
    // Evita divisão por zero caso todos os bipes tenham sido no mesmo instante
    if (intervaloMedio === 0) intervaloMedio = 1; 

    // Quantas unidades saem por dia (ex: 1 item a cada 15 dias = 0.066 unidades por dia)
    const consumoDiario = 1 / intervaloMedio;

    // Atualiza os cards principais
    lblIntervalo.innerText = `${intervaloMedio.toFixed(1).replace('.', ',')} dias`;
    lblConsumoDiario.innerText = `${consumoDiario.toFixed(3).replace('.', ',')} un/dia`;

    // Projeta os períodos solicitados (base padrão de mercado: mês = 30 dias)
    const periodos = [
        { nome: "1 Mês", dias: 30 },
        { nome: "3 Meses (Trimestre)", dias: 90 },
        { nome: "6 Meses (Semestre)", dias: 180 },
        { nome: "1 Ano", dias: 365 }
    ];

    tabelaPrevisao.innerHTML = "";
    
    periodos.forEach(p => {
        // Calcula a quantidade necessária
        let qtdNecessaria = consumoDiario * p.dias;
        
        // Arredonda para cima (pois não dá para pedir fração de produto em estoque de insumos)
        let qtdSugerida = Math.ceil(qtdNecessaria);

        let row = `<tr>
            <td>${p.nome}</td>
            <td>${p.dias} dias</td>
            <td class="sugestao-highlight">${qtdSugerida} ${qtdSugerida === 1 ? 'unidade' : 'unidades'}</td>
        </tr>`;
        tabelaPrevisao.innerHTML += row;
    });

    resultBox.style.display = 'block';
}
</script>

</body>
</html>
