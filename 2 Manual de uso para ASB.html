    <meta charset="UTF-8">

    <title>Manual ASB - Consulta de Produtos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { 
            --primary: #1E293B; 
            --accent: #38BDF8; 
            --success: #10B981; 
            --warning: #F59E0B; 
            --danger: #EF4444; 
            --bg: #0F172A; 
            --card-bg: #1E293B;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 15px; 
            color: var(--text-main); 
        }
        
        .container { max-width: 600px; margin: auto; }
        
        h1 { 
            text-align: center; 
            color: var(--text-main); 
            font-size: 1.3rem; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        
        .nav-link {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 15px;
            font-weight: 500;
        }

        #search-container { 
            position: sticky; 
            top: 0; 
            background: var(--bg); 
            padding: 10px 0; 
            z-index: 100; 
        }
        
        input[type="text"] { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #334155; 
            border-radius: 12px; 
            font-size: 16px; 
            box-sizing: border-box; 
            outline: none; 
            background: var(--card-bg);
            color: white;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .product-card { 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 10px; 
            border-left: 6px solid var(--accent); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            cursor: pointer; 
            transition: transform 0.2s;
        }
        
        .product-card:active { transform: scale(0.98); }
        .product-card strong { display: block; font-size: 1rem; color: var(--text-main); margin-bottom: 5px; }
        .product-card small { color: var(--text-muted); font-weight: 500; }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            z-index: 1000; 
            overflow-y: auto; 
        }
        
        .modal-header { 
            background: #1e293b; 
            color: white; 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            border-bottom: 1px solid #334155;
        }
        
        .close-btn { 
            font-weight: bold; 
            cursor: pointer; 
            background: #ef4444; 
            padding: 8px 15px; 
            border-radius: 8px; 
            font-size: 0.9rem;
        }
        
        .modal-body { padding: 20px; padding-bottom: 100px; }

        .info-box { 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
        }
        
        .label { 
            font-size: 0.75rem; 
            color: var(--accent); 
            font-weight: bold; 
            text-transform: uppercase; 
            margin-bottom: 6px; 
            display: block;
        }
        
        .value { font-size: 0.95rem; color: #cbd5e1; white-space: pre-line; line-height: 1.6; }

        .calc-area { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            margin-top: 20px; 
            border: 1px solid var(--accent); 
        }
        
        #dateOpen {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        .status-badge { 
            padding: 15px; 
            border-radius: 8px; 
            color: white; 
            text-align: center; 
            font-weight: bold; 
            margin-top: 15px; 
            font-size: 1.1rem;
        }
        
        .verde { background: var(--success); }
        .amarelo { background: var(--warning); color: #000; }
        .vermelho { background: var(--danger); }

        .btn-export-item { 
            width: 100%; 
            padding: 15px; 
            margin-top: 15px; 
            background: var(--accent); 
            color: #0f172a; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
        }

        #btnMainExport { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            z-index: 200; 
            background: var(--success); 
            color: white; 
            padding: 15px 20px; 
            border-radius: 50px; 
            border: none; 
            font-weight: bold; 
            display: none; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); 
        }
    </style>
</head>

    function render(list) {
        const div = document.getElementById('productList');
        div.innerHTML = list.map((p) => `
            <div class="product-card" onclick='openModal(${JSON.stringify(p)})'>
                <strong>${p.desc}</strong>
                <small>${p.marca} | ${p.tempo_texto}</small>
            </div>
        `).join('');
    }

    function openModal(p) {
        currentProductName = p.desc;
        currentDays = p.d;
        document.getElementById('headerTitle').innerText = p.marca;
        document.getElementById('modalDetails').innerHTML = `
            <div class="info-box"><span class="label">Descrição</span><div class="value">${p.desc}</div></div>
            <div class="info-box"><span class="label">Condições de Armazenamento</span><div class="value">${p.cond}</div></div>
            <div class="info-box"><span class="label">Sinais de Invalidez</span><div class="value">${p.invalid}</div></div>
            <div class="info-box"><span class="label">Fontes</span><div class="value">${p.fonte}</div></div>
        `;
        document.getElementById('dateOpen').value = "";
        document.getElementById('calcResult').innerHTML = "";
        document.getElementById('productModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('productModal').style.display = 'none';
    }

    function updateExpiry() {
        const dateInput = document.getElementById('dateOpen').value;
        if (!dateInput) return;

        const dataAbertura = new Date(dateInput + "T12:00:00");
        const dataVencimento = new Date(dataAbertura);
        dataVencimento.setDate(dataAbertura.getDate() + currentDays);

        // Formatação solicitada: DD/MM/AAAA
        const formatar = (d) => d.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
        const hoje = new Date();
        hoje.setHours(0,0,0,0);
        
        lastExpDateStr = formatar(dataVencimento);
        
        let statusClass = "verde";
        let statusTexto = "DENTRO DO PRAZO";

        if (hoje > dataVencimento) {
            statusClass = "vermelho";
            statusTexto = "PRODUTO VENCIDO";
        } else if ((dataVencimento - hoje) / (1000 * 60 * 60 * 24) <= 7) {
            statusClass = "amarelo";
            statusTexto = "VENCE EM BREVE";
        }

        document.getElementById('calcResult').innerHTML = `
            <div class="status-badge ${statusClass}">
                VENCIMENTO: ${lastExpDateStr}<br>
                ${statusTexto}
            </div>
            <button class="btn-export-item" onclick="addParaExport('${statusTexto}')">＋ ADICIONAR À LISTA</button>
        `;
    }

    function addParaExport(status) {
        const dateInput = document.getElementById('dateOpen').value;
        const [ano, mes, dia] = dateInput.split('-');
        
        consultasAcumuladas.push({
            "Produto": currentProductName,
            "Data de Abertura": `${dia}/${mes}/${ano}`,
            "Validade Calculada": lastExpDateStr,
            "Status": status
        });

        alert("Adicionado para exportação!");
        atualizarBotaoExport();
        closeModal();
    }

    function atualizarBotaoExport() {
        const btn = document.getElementById('btnMainExport');
        const count = document.getElementById('countExp');
        if (consultasAcumuladas.length > 0) {
            btn.style.display = 'block';
            count.innerText = consultasAcumuladas.length;
        }
    }

    function exportarExcel() {
        const worksheet = XLSX.utils.json_to_sheet(consultasAcumuladas);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Validades");
        XLSX.writeFile(workbook, `Controle_ASB_${new Date().toLocaleDateString('pt-BR')}.xlsx`);
    }

    function filterProducts() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = produtos.filter(p => 
            p.desc.toLowerCase().includes(term) || 
            p.marca.toLowerCase().includes(term)
        );
        render(filtered);
    }

    // Inicialização
    render(produtos);
</script>
