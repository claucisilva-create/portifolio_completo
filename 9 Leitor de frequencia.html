<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Frequência Acadêmica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .upload-section { border: 2px dashed #3498db; padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
        .upload-section:hover { background-color: #ebf5fb; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #3498db; color: white; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #ecf0f1; padding: 15px; border-radius: 8px; text-align: center; border-left: 5px solid #3498db; }
        .card h3 { margin: 0; font-size: 1.1em; }
        .card p { font-size: 1.5em; font-weight: bold; margin: 10px 0 0; color: #2980b9; }
        .btn-export { background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; display: flex; align-items: center; gap: 8px; }
        .btn-export:hover { background-color: #219150; }
        .actions { display: flex; justify-content: flex-end; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistema de Gestão de Frequência</h2>
    <p>Converta sua planilha para <strong>CSV</strong> e carregue-a abaixo para calcular a assiduidade por curso.</p>
    
    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
        <strong>Clique para selecionar ou arraste o arquivo CSV</strong>
        <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="handleFile(this.files)">
    </div>

    <div id="results" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Resumo de Frequência (Alunos com ≥ 1 Presença)</h3>
            <button class="btn-export" onclick="exportarRelatorio()">Exportar Relatório</button>
        </div>

        <div class="card-grid" id="statsGrid"></div>

        <table>
            <thead>
                <tr>
                    <th>Curso</th>
                    <th>Total Alunos</th>
                    <th>Alunos Presentes (Min. 1)</th>
                    <th>% de Engajamento</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let dadosProcessados = {};

    function handleFile(files) {
        const file = files[0];
        if (!file) return;

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                processData(results.data);
            }
        });
    }

    function processData(data) {
        const cursosAlvo = ["Enfermagem", "Fisioterapia", "Odontologia", "Medicina"];
        const stats = {};

        cursosAlvo.forEach(curso => {
            stats[curso] = { total: 0, presentes: 0 };
        });

        data.forEach(row => {
            const cursoEstudante = row['Curso'] ? row['Curso'].trim() : null;
            
            if (cursosAlvo.includes(cursoEstudante)) {
                stats[cursoEstudante].total++;

                const presencas = [row['Encontro 1'], row['Encontro 2'], row['Encontro 3']];
                if (presencas.some(p => p && p.toUpperCase() === 'P')) {
                    stats[cursoEstudante].presentes++;
                }
            }
        });

        dadosProcessados = stats;
        displayResults(stats);
    }

    function displayResults(stats) {
        const grid = document.getElementById('statsGrid');
        const tableBody = document.getElementById('tableBody');
        grid.innerHTML = '';
        tableBody.innerHTML = '';

        for (const [curso, info] of Object.entries(stats)) {
            const porcentagem = info.total > 0 ? ((info.presentes / info.total) * 100).toFixed(1) : 0;

            grid.innerHTML += `
                <div class="card">
                    <h3>${curso}</h3>
                    <p>${porcentagem}%</p>
                    <small>${info.presentes} de ${info.total} alunos</small>
                </div>
            `;

            tableBody.innerHTML += `
                <tr>
                    <td>${curso}</td>
                    <td>${info.total}</td>
                    <td>${info.presentes}</td>
                    <td><strong>${porcentagem}%</strong></td>
                </tr>
            `;
        }

        document.getElementById('results').style.display = 'block';
    }

    function exportarRelatorio() {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Curso,Total Alunos,Alunos Presentes,% Engajamento\n";

        for (const [curso, info] of Object.entries(dadosProcessados)) {
            const porcentagem = info.total > 0 ? ((info.presentes / info.total) * 100).toFixed(1) : 0;
            csvContent += `${curso},${info.total},${info.presentes},${porcentagem}%\n`;
        }

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "relatorio_engajamento.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
